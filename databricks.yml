# Bundle: dev -> dev workspace, prod -> prod workspace (auth via DATABRICKS_TOKEN in CI, or databrickscfg locally)
bundle:
  name: dab_demo_project

resources:
  jobs:
    dab_demo_project_job:
      name: dab_demo_project_job
      tasks:
        - task_key: dab_demo_notebook
          notebook_task:
            notebook_path: ./src/dab_demo_notebook.py
          # no cluster -> serverless jobs compute

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-ad36364a-b414.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-1f291616-ab3f.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
